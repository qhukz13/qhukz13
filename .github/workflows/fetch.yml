name: fetch

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["fetch/**", ".github/workflows/fetch.yml"]

permissions:
  contents: write

concurrency:
  group: fetch
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build card
        env:
          # FETCH_TOKEN (a personal access token) also counts private commits.
          GH_TOKEN: ${{ secrets.FETCH_TOKEN || github.token }}
        run: python fetch/build.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fetch-dark.svg fetch-light.svg
          git diff --cached --quiet || { git commit -m "Update fetch card" && git push; }
